spring.application.name=hotel-reservation
server.port=${PORT:8081}

# Database (uses Railway/Render environment variables in production)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/hotel_reservation}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:kavi3542}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool optimizations for cloud DB (Aiven, etc.)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# CORS - allow frontend origin via env variable
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}

# JWT
jwt.secret=${JWT_SECRET:change-this-secret-in-production-min-32-chars-required-for-hs256}
jwt.expiration=${JWT_EXPIRATION:3600000}
