# (1) Allow older TLS versions as a fallback
systemProp.https.protocols=TLSv1,TLSv1.1,TLSv1.2,TLSv1.3

# (2) If you're *not* using any proxy, MAKE SURE these are commented or removed:
# systemProp.http.proxyHost=
# systemProp.http.proxyPort=
# systemProp.https.proxyHost=
# systemProp.https.proxyPort=

# (3) Raise timeouts a bit (optional but helps on slow connections)
systemProp.org.gradle.internal.http.connectionTimeout=60000
systemProp.org.gradle.internal.http.socketTimeout=60000
